name: Build and validate CAD
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD and virtual display
        run: sudo apt-get update && sudo apt-get install -y openscad xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test libraries
        run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/build.py --all --preview
      - run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: Guitarra-Matbit-STL-y-vistas
          path: output/

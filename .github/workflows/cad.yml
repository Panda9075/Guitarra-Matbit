name: Generar STL y revisar CAD
on:
  push:
    branches: [main]
    paths-ignore:
      - 'models/stl/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Probar medidas
        run: python -m pytest -q
      - name: Generar STL y vistas
        run: python scripts/build.py --all --preview
      - name: Validar mallas y cama de impresion
        run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: STL-y-vistas-Matbit
          path: output/
          retention-days: 30
      - name: Publicar STL en repositorio para ver online
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf models/stl
          mkdir -p models/stl
          cp output/*.stl models/stl/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A models/stl/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(cad): export verified 3D STL [skip ci]'
            git push origin HEAD:main
          fi
